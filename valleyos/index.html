<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ValleyOS terminal">
  <title>ValleyOS</title>
  <link rel="icon" type="image/png" href="../GV%20Assets/logo_icon.png">
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root {
      --terminal: #aaa;
      --terminal-dim: #0aa;
      --terminal-bg: #000;
    }

    body.valley-os {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--terminal);
      background: #000;
      font-family: "Courier New", Courier, monospace;
    }

    body.valley-os * {
      cursor: default;
    }

    .valley-os [hidden] {
      display: none;
    }

    body.valley-os::before {
      z-index: 1;
      background: #000;
    }

    .valley-os main {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: clamp(0.75rem, 3vw, 2rem);
      place-items: center;
    }

    .terminal-shell {
      width: min(960px, 100%);
      height: min(680px, 100%);
      overflow: hidden;
      border: 2px solid #55f;
      border-radius: 2.5% / 4%;
      background: var(--terminal-bg);
      box-shadow: 0 0 0 2px #00a;
    }

    .terminal-shell.booting {
      animation: power-on 650ms ease-out both, flicker 140ms steps(2) 5;
    }

    .terminal-screen {
      height: 100%;
      padding: clamp(1rem, 3vw, 2.25rem);
    }

    .boot-gate {
      display: grid;
      height: 100%;
      place-content: center;
      gap: 1.5rem;
      text-align: center;
    }

    .boot-gate p {
      margin: 0;
      color: var(--terminal-dim);
      letter-spacing: 0.18em;
    }

    .valley-os .boot-button {
      padding: 0.65rem 1rem;
      border: 1px solid currentColor;
      color: var(--terminal);
      background: transparent;
      font: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      animation: blink 1.1s steps(2) infinite;
    }

    .valley-os .boot-button:focus-visible,
    .command-input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .terminal {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
      min-height: 0;
    }

    .terminal-output {
      min-height: 0;
      overflow-y: auto;
      scrollbar-color: var(--terminal-dim) var(--terminal-bg);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .terminal-output > div {
      min-height: 1.2em;
    }

    .terminal-output .dim {
      color: var(--terminal-dim);
    }

    .command-form {
      display: flex;
      align-items: baseline;
    }

    .command-form label {
      flex: none;
    }

    .valley-os .command-input {
      min-width: 0;
      flex: 1;
      border: 0;
      border-radius: 0;
      padding: 0 0.25rem;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: text;
      text-transform: uppercase;
      caret-color: var(--terminal);
    }

    .command-input:focus {
      outline: 0;
    }

    .uncertain-digit {
      display: inline-block;
      animation: year-glitch 1.1s steps(1) infinite;
    }

    @keyframes power-on {
      0% { opacity: 0; transform: scaleY(0.015) scaleX(0.4); filter: brightness(8); }
      55% { opacity: 1; transform: scaleY(0.02) scaleX(1); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.84; }
    }

    @keyframes blink {
      50% { opacity: 0.35; }
    }

    @keyframes year-glitch {
      0%, 76%, 80%, 92%, 95%, 100% { color: inherit; opacity: 1; transform: none; text-shadow: none; }
      77% { color: #fff; transform: translate(-2px, 1px) skewX(18deg); text-shadow: 2px 0 #0aa, -2px 0 #f55; }
      78% { opacity: 0.35; transform: translate(2px, -1px); }
      79% { color: #55f; transform: translateX(-1px); text-shadow: -2px 0 #fff; }
      93% { transform: translateX(2px); text-shadow: -1px 0 #f55, 1px 0 #0aa; }
      94% { opacity: 0.5; }
    }

    @media (max-width: 520px) {
      .valley-os main { padding: 0; }
      .terminal-shell { height: 100%; border: 0; border-radius: 0; }
      .terminal-screen { padding: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .terminal-shell.booting,
      .valley-os .boot-button,
      .uncertain-digit { animation: none; }
    }
  </style>
</head>
<body class="valley-os">
  <main>
    <section class="terminal-shell" aria-label="ValleyOS terminal">
      <div class="terminal-screen">
        <div class="boot-gate" id="boot-gate">
          <p>VALLEY SYSTEMS MODEL 198<span class="uncertain-digit">7</span></p>
          <button class="boot-button" id="boot-button" type="button">Press any key to boot</button>
        </div>

        <div class="terminal" id="terminal" hidden>
          <div class="terminal-output" id="output" role="log" aria-live="polite" aria-relevant="additions"></div>
          <form class="command-form" id="command-form" autocomplete="off" hidden>
            <label for="command-input">V:\VALLEY&gt;</label>
            <input class="command-input" id="command-input" aria-label="ValleyOS command" autocapitalize="characters" autocomplete="off" spellcheck="false" disabled>
          </form>
        </div>
      </div>
    </section>
  </main>
  <noscript>ValleyOS requires JavaScript. <a href="../">Return to Golden Valley</a>.</noscript>

  <script>
    const bootGate = document.querySelector("#boot-gate");
    const bootButton = document.querySelector("#boot-button");
    const shell = document.querySelector(".terminal-shell");
    const terminal = document.querySelector("#terminal");
    const output = document.querySelector("#output");
    const form = document.querySelector("#command-form");
    const input = document.querySelector("#command-input");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const files = {};

    async function loadFiles() {
      const manifest = await fetch("../OSF/index.json");
      if (!manifest.ok) throw new Error(`OSF manifest: ${manifest.status}`);
      const names = await manifest.json();
      if (!Array.isArray(names)) throw new Error("Invalid OSF manifest");
      const entries = await Promise.all(names.map(async name => {
        const response = await fetch(`../OSF/${encodeURIComponent(name)}`);
        if (!response.ok) throw new Error(`${name}: ${response.status}`);
        return [name.toUpperCase(), await response.text()];
      }));
      Object.assign(files, Object.fromEntries(entries));
    }

    const filesReady = loadFiles().then(() => true, () => false);
    let booting = false;
    let soundEnabled = true;
    let audioContext;

    function audio() {
      if (!soundEnabled) return null;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      audioContext ??= new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function tone(frequency, offset, duration) {
      const context = audio();
      if (!context) return;
      const start = context.currentTime + offset;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.035, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    function playStartupSound() {
      [110, 220, 330, 660].forEach((frequency, index) => tone(frequency, index * 0.12, 0.16));
    }

    function playDriveSound() {
      const context = audio();
      if (!context) return;
      const frames = Math.floor(context.sampleRate * 0.22);
      const buffer = context.createBuffer(1, frames, context.sampleRate);
      const samples = buffer.getChannelData(0);
      const pulse = Math.floor(context.sampleRate * 0.035);
      for (let index = 0; index < frames; index++) {
        samples[index] = (Math.random() * 2 - 1) * (index % pulse < pulse / 5 ? 0.35 : 0.015) * (1 - index / frames);
      }
      const source = context.createBufferSource();
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      source.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.value = 900;
      filter.Q.value = 0.8;
      gain.gain.value = 0.16;
      source.connect(filter).connect(gain).connect(context.destination);
      source.start();
    }

    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, reduceMotion ? 0 : milliseconds));
    const print = (text = "", className = "") => {
      const line = document.createElement("div");
      line.className = className;
      const year = text.match(/^(.*198)(\d)(.*)$/);
      if (year) {
        const digit = document.createElement("span");
        digit.className = "uncertain-digit";
        digit.textContent = year[2];
        line.append(year[1], digit, year[3]);
      } else {
        line.textContent = text;
      }
      output.append(line);
      output.scrollTop = output.scrollHeight;
    };

    const glitchDigit = () => String(Math.floor(Math.random() * 10));
    const glitch = () => {
      document.querySelectorAll(".uncertain-digit").forEach(digit => {
        digit.textContent = glitchDigit();
      });
      setTimeout(glitch, reduceMotion ? 1000 : 70 + Math.random() * 430);
    };
    glitch();

    async function boot() {
      if (booting) return;
      booting = true;
      playStartupSound();
      bootGate.hidden = true;
      terminal.hidden = false;
      shell.classList.add("booting");
      const driveReady = await filesReady;

      const sequence = [
        ["VALLEY SYSTEMS BIOS 3.7", 380],
        ["MEMORY TEST: 640K OK", 520],
        ["CHECKING SOUL DRIVE...", 700],
        [`SOUL DRIVE V: ${driveReady ? "READY" : "ERROR"}`, 320],
        ["LOADING VALLEYOS........", 760],
        ["", 180],
        ["ValleyOS Version 1.0", 120],
        ["Copyright (C) 1987 Valley Systems", 120],
        ["Type HELP for available commands.", 0]
      ];

      for (const [line, delay] of sequence) {
        print(line);
        if (line === "CHECKING SOUL DRIVE...") playDriveSound();
        await wait(delay);
      }
      shell.classList.remove("booting");
      form.hidden = false;
      input.disabled = false;
      input.focus();
    }

    function listDirectory() {
      print(" Volume in drive V is VALLEY");
      print(" Directory of V:\\");
      print("");
      Object.entries(files).forEach(([name, contents]) => {
        print(`${name.padEnd(15)} ${String(contents.length).padStart(5)} bytes`);
      });
      print(`        ${Object.keys(files).length} File(s)`);
    }

    function runCommand(rawCommand) {
      const [command = "", ...args] = rawCommand.trim().toUpperCase().split(/\s+/);
      const argument = args.join(" ");
      print(`V:\\VALLEY>${rawCommand}`, "dim");

      if (!command) return;
      if (command === "HELP") {
        print("HELP  DIR  TYPE  CLS  VER  SOUND ON|OFF  EXIT");
      } else if (command === "DIR") {
        playDriveSound();
        listDirectory();
      } else if (command === "TYPE") {
        if (!argument) print("Required parameter missing");
        else {
          playDriveSound();
          print(files[argument] ?? "File not found");
        }
      } else if (command === "CLS") {
        output.replaceChildren();
      } else if (command === "VER") {
        print("ValleyOS Version 1.0 (Build 1987)");
      } else if (command === "SOUND") {
        if (argument === "ON" || argument === "OFF") {
          soundEnabled = argument === "ON";
          if (soundEnabled) tone(880, 0, 0.08);
          else {
            audioContext?.close();
            audioContext = undefined;
          }
          print(`Sound ${argument.toLowerCase()}.`);
        } else {
          print(`Sound is ${soundEnabled ? "on" : "off"}. Use SOUND ON or SOUND OFF.`);
        }
      } else if (command === "EXIT") {
        location.assign("../");
      } else {
        print(`Bad command or file name: ${command}`);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const command = input.value;
      input.value = "";
      runCommand(command);
    });
    bootButton.addEventListener("click", boot, { once: true });
    document.addEventListener("keydown", boot, { once: true });

    console.assert(/^\d$/.test(glitchDigit()), "ValleyOS year glitch failed");
    filesReady.then(ready => console.assert(ready && Object.keys(files).length, "ValleyOS OSF failed"));
  </script>
</body>
</html>
